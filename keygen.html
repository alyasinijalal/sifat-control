<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Генератор Ключей — Sifat Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'Outfit', monospace;
    }
  </style>
</head>
<div className="min-h-screen flex items-center justify-center p-4">
  <div className="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 relative overflow-hidden backdrop-blur-xl">
    
    {/* Decorative Glow */}
    <div className="absolute -top-20 -left-20 w-40 h-40 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div className="absolute -bottom-20 -right-20 w-40 h-40 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>

    {/* Header */}
    <div className="text-center space-y-2 relative z-10">
      <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 mb-1">
        <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"></path>
        </svg>
      </div>
      <h1 className="text-xl font-bold text-white tracking-tight">Генератор Ключей</h1>
      <p className="text-xs text-slate-400">Sifat Control Admin Mobile Keygen</p>
    </div>

    {/* Form */}
    <div className="space-y-4 relative z-10">
      <div>
        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
          Код ПК пользователя (HWID):
        </label>
        <input 
          type="text" 
          id="hwidInput"
          placeholder="например: 4F8A-99B2-C11D-890E" 
          className="w-full px-4 py-3.5 bg-slate-950/80 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 rounded-xl text-white font-mono-code text-sm tracking-wider uppercase outline-none transition-all"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
        />
      </div>

      <button 
        onclick="generateKey()"
        className="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-[0.98] text-white font-semibold text-sm rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 transition-all"
      >
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <span>Сгенерировать Ключ</span>
      </button>

      {/* Generated Result Box */}
      <div id="resultBox" className="hidden space-y-2 pt-2 animate-fadeIn">
        <label className="block text-xs font-semibold text-emerald-400 uppercase tracking-wider">
          Сгенерированный Ключ Активации:
        </label>
        <div className="flex items-center justify-between gap-2 bg-slate-950 border border-emerald-500/40 rounded-xl p-3">
          <span id="generatedKeyText" className="font-mono-code font-bold text-emerald-300 text-sm tracking-wider select-all"></span>
          <button 
            onclick="copyKey()"
            id="copyBtn"
            className="px-3 py-1.5 text-xs font-semibold bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 rounded-lg shrink-0 transition-colors"
          >
            Скопировать
          </button>
        </div>
      </div>
    </div>

    <div className="text-center text-[11px] text-slate-400 border-t border-slate-800/80 pt-3 relative z-10">
      Работает полностью офлайн на любом смартфоне.
    </div>

  </div>
</div>

<script>
  const MASTER_SECRET = "SIFAT_CONTROL_MASTER_KEY_2026_SECURE_AUTH_@#$!";

  function generateKey() {
    const hwidInput = document.getElementById('hwidInput').value.trim();
    if (!hwidInput) {
      alert('Пожалуйста, введите или вставьте код ПК (HWID)');
      return;
    }

    const cleanHwid = hwidInput.replace(/[^A-Z0-9]/gi, '').toUpperCase();
    const combined = cleanHwid + ':' + MASTER_SECRET;
    
    let h1 = 0x811c9dc5;
    let h2 = 5381;
    for (let i = 0; i < combined.length; i++) {
      const code = combined.charCodeAt(i);
      h1 = (h1 ^ code) * 16777619;
      h2 = ((h2 << 5) + h2) ^ code;
    }
    
    const b1 = Math.abs(h1).toString(36).slice(-4).padStart(4, 'X').toUpperCase();
    const b2 = Math.abs(h2).toString(36).slice(-4).padStart(4, 'Y').toUpperCase();
    const b3 = Math.abs(h1 ^ h2).toString(36).slice(-4).padStart(4, 'Z').toUpperCase();
    const b4 = Math.abs(h1 + h2).toString(36).slice(-4).padStart(4, 'K').toUpperCase();
    
    const generatedKey = 'KEY-' + b1 + '-' + b2 + '-' + b3 + '-' + b4;

    document.getElementById('generatedKeyText').innerText = generatedKey;
    document.getElementById('resultBox').classList.remove('hidden');
  }

  function copyKey() {
    const keyText = document.getElementById('generatedKeyText').innerText;
    navigator.clipboard.writeText(keyText);
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.innerText = 'Скопировано!';
    copyBtn.classList.add('bg-emerald-500', 'text-slate-950');
    setTimeout(() => {
      copyBtn.innerText = 'Скопировать';
      copyBtn.classList.remove('bg-emerald-500', 'text-slate-950');
    }, 2000);
  }
</script>
</body>
</html>
